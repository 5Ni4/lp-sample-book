name: Publish NILTO articles

on:
  push:
    branches: [main]
  workflow_dispatch:
  # CMS edits do not push to GitHub; refresh the published feed on a timer.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check portfolio gallery and sample inventory
        run: python3 scripts/build-gallery.py --check
      - name: Build site from published NILTO articles
        env:
          NILTO_PUBLIC_API_KEY: ${{ secrets.NILTO_PUBLIC_API_KEY }}
        run: python3 scripts/build-nilto-site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
