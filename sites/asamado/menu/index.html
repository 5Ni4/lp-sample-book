<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7ecd7">
<meta name="description" content="パン屋あさまどのおしながき。パン、サンド、焼き菓子の名前、税込価格と紹介。">
<title>おしながき | パン屋 あさまど</title>
<link rel="stylesheet" href="../style.css">
<script defer src="../bread.js?v=2"></script>
<style>
.bread-menu{max-width:760px;padding-block:clamp(36px,7vw,80px)}
.bread-menu h1,.bread-menu h2,.bread-menu h3{font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.bread-menu h1{font-size:clamp(2.5rem,7vw,4rem);line-height:1.15;color:#3e2e23;margin:12px 0 24px}
.bread-menu .back{color:#79513a;text-underline-offset:.3em}
.menu-categories{display:flex;flex-wrap:wrap;gap:.65rem 1.5rem;padding:.6rem 0 1.1rem;border-bottom:1px solid #ceb294}
.menu-categories a{color:#79513a;font-weight:700;text-underline-offset:.25em}
.menu-section{padding-top:clamp(25px,5vw,42px);scroll-margin-top:1rem}
.menu-section h2{font-size:clamp(1.4rem,4vw,1.85rem);color:#674332;padding-bottom:.5rem;margin:0;border-bottom:1px solid #ceb294}
.menu-lines{list-style:none;padding:0;margin:0}
.menu-item{display:grid;grid-template-columns:clamp(52px,16vw,76px) minmax(0,1fr) max-content;align-items:center;gap:clamp(10px,3.5vw,19px);padding:15px 0;border-bottom:1px solid #e0cbb0;scroll-margin-top:16px}
.menu-item:target{background:#fff8e7;outline:2px solid #a3542b;outline-offset:3px}
.menu-thumbnail{grid-column:1;grid-row:1;width:100%;aspect-ratio:1;overflow:hidden;border-radius:5px;background:#f5e7cf}
.menu-thumbnail img,.menu-thumbnail .menu-drawing{display:block;width:100%;height:100%;object-fit:cover;border-radius:0!important;border:0!important}
.menu-thumbnail:empty{visibility:hidden}
.menu-copy{grid-column:2;grid-row:1;min-width:0}
.menu-copy h3{font-size:clamp(1rem,3.8vw,1.22rem);margin:0;line-height:1.43;overflow-wrap:anywhere;color:#3e2e23}
.menu-copy p{font-size:clamp(.76rem,2.7vw,.85rem);margin:.22rem 0 0;line-height:1.55;color:#675748;overflow-wrap:anywhere}
.menu-price{grid-column:3;grid-row:1;align-self:start;padding-top:.15rem;color:#79513a;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-note{color:#675748;margin-top:1.3rem;font-size:.78rem}
</style>
</head>
<body>
<header class="mast wrap"><a class="logo" href="../"><span><small>パン屋</small>あさまど</span></a></header>
<main class="wrap bread-menu">
<a class="back" href="../#bread">‹ お店のページに戻る</a>
<h1>おしながき</h1>
<nav class="menu-categories" aria-label="おしながきの分類">
<a href="#menu-bread">パン</a><a href="#menu-sandwich">サンド</a><a href="#menu-sweets">焼き菓子</a>
</nav>
<div id="menu-entries"></div>
<p class="menu-note">価格は税込です。</p>
<noscript><p>おしながきはJavaScriptを有効にすると表示されます。</p></noscript>
</main>
<footer class="footer"><div class="wrap"><span class="footer-name">パン屋 あさまど</span><a href="../">お店のページへ</a></div></footer>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const menu = document.querySelector("#menu-entries");
  const grouped = [["パン","menu-bread"],["サンド","menu-sandwich"],["焼き菓子","menu-sweets"]];
  const prices = new Intl.NumberFormat("ja-JP");
  for (const [label,id] of grouped) {
    const products = breadCatalog.filter(p => p.category === label);
    if (!products.length) continue;
    const section = node("section","","menu-section");
    section.id = id;
    const title = node("h2",label);
    title.id = id + "-title";
    section.setAttribute("aria-labelledby",title.id);
    const list = node("ul","","menu-lines");
    for (const p of products) {
      const item = node("li","","menu-item"); item.id = p.id;
      const frame = node("div","","menu-thumbnail"); frame.setAttribute("aria-hidden","true"); frame.append(menuPhoto(p));
      const copy = node("div","","menu-copy"); copy.append(node("h3",p.name), node("p",p.description));
      item.append(frame,copy,node("span",prices.format(p.price)+"円","menu-price"));
      list.append(item);
    }
    section.append(title,list);
    menu.append(section);
  }
  if (location.hash) {
    const hash = location.hash.slice(1);
    let id = hash;
    try { id = decodeURIComponent(hash); } catch {}
    document.getElementById(id)?.scrollIntoView();
  }
});
</script>
</body>
</html>
