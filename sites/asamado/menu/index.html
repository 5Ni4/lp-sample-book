<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7ecd7">
<meta name="description" content="パン屋あさまどのおしながき。パン、サンド、焼き菓子の名前、税込価格と紹介。">
<title>おしながき | パン屋 あさまど</title>
<link rel="stylesheet" href="../style.css">
<script defer src="../bread.js?v=2"></script>
<style>
.bread-menu{max-width:760px;padding-block:clamp(36px,7vw,80px)}
.bread-menu h1,.bread-menu h2,.bread-menu h3{font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.bread-menu h1{font-size:clamp(2.5rem,7vw,4rem);line-height:1.15;color:#3e2e23;margin:14px 0 25px;position:relative;isolation:isolate;width:fit-content;max-width:100%;padding:0 .15em .17em;letter-spacing:.064em}
.bread-menu h1::after{content:"";position:absolute;z-index:-1;left:-.04em;right:-.08em;bottom:.07em;height:.30em;border-radius:49% 39% 46% 31% / 46% 61% 44% 56%;background:#ebca91;transform:rotate(-2.2deg);opacity:.74}
.bread-menu h1::before{content:"";position:absolute;right:-.41em;top:.04em;width:.14em;height:.14em;border-radius:50%;background:#ae6337;box-shadow:.18em -.10em 0 -.028em #bd8248,.21em .1em 0 -.045em #bd8248}
.bread-menu .back{color:#79513a;text-underline-offset:.3em}
.menu-categories{display:flex;flex-wrap:wrap;gap:.65rem 1.5rem;padding:.6rem 0 1.1rem;border-bottom:1px solid #ceb294}
.menu-categories a{color:#79513a;font-weight:700;text-underline-offset:.25em}
.menu-section{padding-top:clamp(25px,5vw,42px);scroll-margin-top:1rem}
.menu-section h2{font-size:clamp(1.4rem,4vw,1.85rem);color:#674332;display:flex;align-items:center;gap:.62em;padding:0 0 .68rem;margin:0;border-bottom:1px solid #ceb294;letter-spacing:.06em}
.menu-section h2::before{content:"";width:.54em;height:.37em;flex:none;margin-inline-start:.08em;border-radius:85% 14% 82% 14%;background:#9a793b;transform:rotate(-28deg);box-shadow:.06em .09em 0 #d6b779}
.menu-lines{list-style:none;padding:0;margin:0}
.menu-item{display:grid;grid-template-columns:min(44%,228px) minmax(0,1fr) max-content;align-items:center;gap:clamp(15px,4vw,32px);padding:clamp(16px,3vw,24px) 0;border-bottom:1px solid #e0cbb0;scroll-margin-top:16px}
.menu-item:target{background:#fff8e7;outline:2px solid #a3542b;outline-offset:3px}
.menu-thumbnail{grid-column:1;grid-row:1;width:100%;aspect-ratio:1 / 1;position:relative;isolation:isolate;overflow:hidden;min-width:0;border-radius:43% 48% 39% 45% / 44% 39% 50% 47%;background:radial-gradient(ellipse at 30% 24%,#fff3db,transparent 70%),#ecd3ac}
.menu-thumbnail::after{content:"";position:absolute;inset:2%;z-index:-1;pointer-events:none;border:1px dashed #a472477d;border-radius:45% 47% 39% 43% / 41% 44% 48% 47%;transform:rotate(-5deg)}
.menu-item:nth-child(2n) .menu-thumbnail{border-radius:48% 41% 48% 39% / 40% 46% 42% 50%;background:radial-gradient(ellipse at 22% 20%,#fcf3df,transparent 70%),#e9d9b7}
.menu-art{position:absolute;inset:4%;background-image:url("../photos/menu-bread-art.webp");background-size:400% 400%;background-repeat:no-repeat;pointer-events:none}
.menu-thumbnail:empty{visibility:hidden}
.menu-copy{grid-column:2;grid-row:1;min-width:0}
.menu-copy h3{font-size:clamp(1rem,3.8vw,1.22rem);margin:0;line-height:1.43;overflow-wrap:anywhere;color:#3e2e23}
.menu-copy p{font-size:clamp(.76rem,2.7vw,.85rem);margin:.22rem 0 0;line-height:1.55;color:#675748;overflow-wrap:anywhere}
.menu-price{grid-column:3;grid-row:1;align-self:start;padding-top:.15rem;color:#79513a;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:560px){
  .menu-item{grid-template-columns:min(44%,228px) minmax(0,1fr);grid-template-rows:1fr auto 1fr;gap:6px clamp(12px,4vw,18px)}
  .menu-thumbnail{grid-row:1 / 4;align-self:center}
  .menu-copy{grid-row:2}
  .menu-price{grid-column:2;grid-row:3;align-self:start;padding-top:0;font-size:.9rem}
}
.menu-note{color:#675748;margin-top:1.3rem;font-size:.78rem}

.menu-taste{appearance:none;display:block;position:relative;grid-column:1;grid-row:1;align-self:center;min-width:0;width:100%;padding:0;border:0;border-radius:43% 48% 39% 45%;background:transparent;cursor:pointer}
.menu-taste:focus-visible{outline:2px solid #79513a;outline-offset:4px}
.menu-taste .menu-thumbnail{display:block}
.menu-taste[data-bite="1"]{--bite-cut:url(#asamado-bite-1)}
.menu-taste[data-bite="2"]{--bite-cut:url(#asamado-bite-2)}
.menu-taste[data-bite="3"]{--bite-cut:url(#asamado-bite-3)}
.menu-taste[data-bite] :is(.menu-art,.menu-drawing,.menu-thumbnail>img){clip-path:var(--bite-cut)}
.menu-taste[data-bite]::after{content:"";pointer-events:none;position:absolute;width:2%;aspect-ratio:1;top:41%;left:77%;border-radius:40% 60% 53% 47%;background:#aa6735;box-shadow:.45em -.2em 0 -.02em #c89257,-.16em .65em 0 -.02em #b5773b;transform:rotate(-18deg)}
/* Only the croissant uses separate, cumulative bite locations. */
#croissant .menu-taste[data-bite="1"]{--bite-cut:url(#croissant-bite-1);--bread-turn:-7deg;--crumb-top:59%;--crumb-left:84%}
#croissant .menu-taste[data-bite="2"]{--bite-cut:url(#croissant-bite-2);--bread-turn:9deg;--crumb-top:23%;--crumb-left:60%}
#croissant .menu-taste[data-bite="3"]{--bite-cut:url(#croissant-bite-3);--bread-turn:-12deg;--crumb-top:70%;--crumb-left:15%}
#croissant .menu-art{transform:rotate(var(--bread-turn,0deg));transform-origin:center 57%;transition:transform .17s ease-out}
#croissant .menu-taste[data-bite]::after{top:var(--crumb-top);left:var(--crumb-left)}
@media(prefers-reduced-motion:reduce){#croissant .menu-art{transition:none}}
.menu-se-credit{font-size:.72rem;color:#675748;margin-top:1rem}
.menu-se-credit a{color:inherit;text-underline-offset:.2em}
@media(max-width:560px){.menu-taste{grid-row:1 / 4}.menu-taste .menu-thumbnail{grid-row:auto}}
</style>
</head>
<body>

<h1>おしながき</h1>
<nav class="menu-categories" aria-label="おしながきの分類">
<a href="#menu-bread">パン</a><a href="#menu-sandwich">サンド</a><a href="#menu-sweets">焼き菓子</a>

<p class="menu-note">イラストを押すと、ひとくち。三口のあとにもう一度押すと元に戻ります。</p>

<footer class="footer"><div class="wrap"><span class="footer-name">パン屋 あさまど</span><a href="../">お店のページへ</a></div></footer>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const menu = document.querySelector("#menu-entries");
  const grouped = [["パン","menu-bread"],["サンド","menu-sandwich"],["焼き菓子","menu-sweets"]];
  const prices = new Intl.NumberFormat("ja-JP");
  const biteAudio = new Audio("../audio/croissant-crust-20261128.mp3");
  biteAudio.preload = "auto";
  function tasteButton(product, illustration) {
    const button = node("button","","menu-taste");
    button.type = "button";
    button.append(illustration);
    const bites = ["一口目", "二口目", "三口目"];
    let eaten = 0;
    function show(level) {
      if (level) button.setAttribute("data-bite", String(level));
      else button.removeAttribute("data-bite");
    }
    function announceNext() {
      const action = eaten === 3 ? "を元に戻す" : "をかじる（" + bites[eaten] + "）";
      button.setAttribute("aria-label", product.name + action);
    }
    announceNext();
    button.addEventListener("pointerenter", event => {
      if (event.pointerType === "mouse") show(Math.min(eaten + 1, 3));
    });
    button.addEventListener("pointerleave", () => show(eaten));
    button.addEventListener("click", () => {
      eaten = (eaten + 1) % 4;
      show(eaten);
      announceNext();
      if (!eaten) return;
      try {
        biteAudio.currentTime = 0;
        biteAudio.play()?.catch(() => {});
      } catch {}
    });
    return button;
  }

  for (const [label,id] of grouped) {
    const products = breadCatalog.filter(p => p.category === label);
    if (!products.length) continue;
    const section = node("section","","menu-section");
    section.id = id;
    const title = node("h2",label);
    title.id = id + "-title";
    section.setAttribute("aria-labelledby",title.id);
    const list = node("ul","","menu-lines");
    for (const p of products) {
      const item = node("li","","menu-item"); item.id = p.id;
      const frame = node("div","","menu-thumbnail"); frame.setAttribute("aria-hidden","true");
      const artIndex = p.imageTile ?? {"croissant":12,"campagne":13,"salt-roll":14}[p.id];
      if (Number.isInteger(artIndex)) {
        const art = node("span","","menu-art");
        art.style.backgroundPosition = [artIndex % 4,Math.floor(artIndex / 4)].map(n=>n*100/3+"%").join(" ");
        frame.append(art);
      } else frame.append(menuPhoto(p));
      const copy = node("div","","menu-copy"); copy.append(node("h3",p.name), node("p",p.description));
      item.append(tasteButton(p,frame),copy,node("span",prices.format(p.price)+"円","menu-price"));
      list.append(item);
    }
    section.append(title,list);
    menu.append(section);
  }
  if (location.hash) {
    const hash = location.hash.slice(1);
    let id = hash;
    try { id = decodeURIComponent(hash); } catch {}
    document.getElementById(id)?.scrollIntoView();
  }
});
</script>
