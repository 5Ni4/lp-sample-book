<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="オリジナルキャラクター524のLINEスタンプ紹介。了解、お礼、相づち、おじぎの4つの絵柄見本を掲載しています。">
  <title>524の毎日のひとこと｜LINEスタンプ紹介</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/styles.css">
</head>
<body class="sample-page theme--524">
  <a class="skip-link" href="#main">本文へ移動</a>
  <div class="demo-strip"><span>LP SAMPLE</span><span>524のLINEスタンプ紹介見本です。</span></div>

  <header class="site-header stamp-header">
    <a class="brand" href="#main" aria-label="524のLINEスタンプ ページの先頭">
      <span class="brand__mark brand__mark--524" aria-hidden="true">524</span>
      <span class="brand__word">524のスタンプ</span>
    </a>
    <nav class="stamp-nav" aria-label="このページのメニュー">
      <a href="#stickers">スタンプ一覧</a>
      <a href="#release">配信情報</a>
    </nav>
  </header>

  <main id="main">
    <section class="stamp-hero" aria-labelledby="stamp-title">
      <div class="stamp-hero__inner page-wrap">
        <div class="stamp-hero__copy">
          <p class="stamp-kind">LINEスタンプ</p>
          <h1 id="stamp-title"><span>524の</span><span>毎日のひとこと</span></h1>
          <p>確認の返事や、ちょっとしたお礼に。いつものひとことに、524の表情を添えて。</p>
          <a class="button stamp-button" href="#stickers">スタンプを見る <span aria-hidden="true">↓</span></a>
        </div>
        <div class="stamp-hero__art" aria-hidden="true">
          <img class="stamp-hero__image stamp-hero__image--main" src="../../assets/524-stickers/understood.webp" alt="" width="640" height="640" fetchpriority="high">
          <img class="stamp-hero__image stamp-hero__image--top" src="../../assets/524-stickers/thank-you.webp" alt="" width="640" height="640">
          <img class="stamp-hero__image stamp-hero__image--bottom" src="../../assets/524-stickers/nodding.webp" alt="" width="640" height="640">
        </div>
      </div>
    </section>

    <section id="stickers" class="stamp-section page-wrap" aria-labelledby="stickers-title">
      <header class="stamp-section__head">
        <h2 id="stickers-title">スタンプ一覧</h2>
        <p>ふだんのトークで使える、4つの絵柄見本。</p>
      </header>

      <div class="stamp-previews">
        <figure class="stamp-preview">
          <div class="stamp-preview__art"><img src="../../assets/524-stickers/understood.webp" alt="まっすぐ前を向く524" width="640" height="640" loading="lazy"></div>
          <figcaption><strong>了解しました</strong><span>確認の返事に</span></figcaption>
        </figure>
        <figure class="stamp-preview">
          <div class="stamp-preview__art"><img src="../../assets/524-stickers/thank-you.webp" alt="小さく体を揺らす524" width="640" height="640" loading="lazy"></div>
          <figcaption><strong>ありがとうございます</strong><span>お礼を伝えたいときに</span></figcaption>
        </figure>
        <figure class="stamp-preview">
          <div class="stamp-preview__art"><img src="../../assets/524-stickers/nodding.webp" alt="少し傾いてうなずく524" width="640" height="640" loading="lazy"></div>
          <figcaption><strong>うんうん</strong><span>共感の相づちに</span></figcaption>
        </figure>
        <figure class="stamp-preview">
          <div class="stamp-preview__art"><img src="../../assets/524-stickers/bow.webp" alt="ぺこりとおじぎをする524" width="640" height="640" loading="lazy"></div>
          <figcaption><strong>ペコリ</strong><span>あいさつやお礼に</span></figcaption>
        </figure>
      </div>
    </section>

    <section id="release" class="stamp-release" aria-labelledby="release-title">
      <div class="stamp-release__inner page-wrap">
        <div>
          <h2 id="release-title">配信情報</h2>
          <p>このページは、524の絵柄を使ったLINEスタンプの紹介見本です。</p>
        </div>
        <dl>
          <div><dt>キャラクター</dt><dd>524</dd></div>
          <div><dt>掲載内容</dt><dd>スタンプの絵柄見本 4点</dd></div>
          <div><dt>LINE STORE</dt><dd>購入リンクは未設定です</dd></div>
        </dl>
      </div>
    </section>
  </main>

  <footer class="sample-footer stamp-footer">
    <div class="page-wrap">
      <a class="brand" href="#main" aria-label="524のLINEスタンプ ページの先頭">
        <span class="brand__mark brand__mark--524" aria-hidden="true">524</span>
        <span class="brand__word">524のスタンプ</span>
      </a>
      <a class="return-top" href="../../index.html">LPサンプル一覧へ戻る <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
