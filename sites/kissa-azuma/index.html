<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>喫茶アズマ | サンプル</title>
<meta name="description" content="架空の喫茶店『喫茶アズマ』のWebサイト作例。">
<link rel="stylesheet" href="style.css">
<style>
.social{--azuma-green:#263a32;--azuma-ivory:#f5ebdd;--azuma-brass:#cfb585;background:var(--azuma-green);color:var(--azuma-ivory);border:0;margin-block:0 40px;padding:clamp(23px,6vw,55px) clamp(14px,6vw,55px)}
.social .overline,.social-credit a,.social .source{color:var(--azuma-brass)}
.social h2{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(2.05rem,6vw,3.5rem);margin-block:.2em .4em;letter-spacing:.07em}
.social .posts{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-top:1.25rem;border-top:1px solid #cfb58582}
.social .post{border:0;background:none;padding:1.1rem 0 0;width:min(100%,550px);margin-inline:auto}
.social .post+.post{width:min(100%,370px);margin-top:1.7rem;margin-left:0;padding-top:1.1rem;border-top:1px solid #cfb58582}
.social .post .instagram-media,.social .post iframe{display:block;border-radius:2px}
.social .embed-btn{background:transparent;color:var(--azuma-ivory);border-color:var(--azuma-brass)}
.social a:focus-visible,.social button:focus-visible{outline-color:var(--azuma-brass)}
.social .source,.social-credit{font-size:.86rem}
.social .social-credit{color:var(--azuma-ivory);margin:1.7rem 0 0}
</style>
<script defer src="instagram.js"></script>
</head>
<body>
<a class="skip" href="#main">本文へ</a>
<header class="shell top"><a href="../../">LPサンプル集</a><span>架空店舗の作例</span></header>
<main id="main" class="shell">
<section class="intro">
<div class="mark" aria-hidden="true"><span></span></div>
<p class="overline" lang="en">KISSA AZUMA</p>
<h1>喫茶アズマ</h1>
<p>コーヒーを一杯。窓辺でひと息。</p>
<a class="jump" href="#instagram">Instagramの写真を見る <span aria-hidden="true">↓</span></a>
</section>
<section class="about" aria-labelledby="about-title"><h2 id="about-title">喫茶アズマについて</h2><p>あたたかいコーヒーと、静かに過ごせる席。窓から入る光と一緒に、午後のひとときを。</p><p class="fine">実在する店舗ではありません。掲載する写真は撮影者本人のカフェ活動の記録で、喫茶アズマの実店舗・商品を示すものではありません。</p></section>
<section id="instagram" class="social" aria-labelledby="instagram-title">
<p class="overline" lang="en">KISSA AZUMA / INSTAGRAM</p><h2 id="instagram-title">今日の一皿</h2>
<div class="posts" id="posts" aria-live="polite"></div>
<p class="social-credit">撮影：<a href="https://www.instagram.com/eos_kurogoma/" rel="noopener noreferrer">@eos_kurogoma</a></p>
<noscript><p>埋め込みはJavaScriptが必要です。<a href="https://www.instagram.com/eos_kurogoma/">Instagramで見る</a></p></noscript>
</section>
</main>
<footer class="shell foot">喫茶アズマ <span>架空店舗のWebサイト作例</span></footer>
</body></html>
