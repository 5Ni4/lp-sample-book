<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="飲食・多店舗と、524のスタンプと絵文字のLPサンプル集。">
  <title>LPサンプル集｜LP SAMPLE BOOK</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/gallery.css">
  <script src="assets/site.js" defer></script>
</head>
<body class="theme--gallery">
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="gallery-header gallery-wrap">
    <a class="gallery-brand" href="./" aria-label="LPサンプル集 トップ">LP SAMPLE BOOK</a>
    <a class="gallery-nav" href="#samples">サンプル一覧</a>
  </header>

  <main id="main" class="gallery-wrap">
    <h1 class="gallery-title">LPサンプル集</h1>
    <section id="samples" aria-label="LPサンプル一覧">
      <div class="gallery-filters" role="group" aria-label="業種で絞り込む">
        <button type="button" data-filter="all" aria-pressed="true" class="is-active">すべて</button>
        <button type="button" data-filter="restaurant" aria-pressed="false">飲食・多店舗</button>
        <button type="button" data-filter="character" aria-pressed="false">キャラクター</button>
      </div>
      <div class="gallery-grid">
        <article class="sample-card gallery-card" data-category="restaurant">
          <a href="sites/restaurant/" class="gallery-card__link">
            <div class="gallery-card__image">
              <img src="assets/sample-previews/restaurant.png" width="1200" height="800" alt="料理写真と店舗案内を掲載した街の食卓グループのページ" fetchpriority="high">
            </div>
            <div class="gallery-card__caption">
              <h2>街の食卓グループ</h2>
              <p>飲食・多店舗・ブログ</p>
            </div>
          </a>
        </article>
        <article class="sample-card gallery-card" data-category="character">
          <a href="sites/524-line-stickers/" class="gallery-card__link">
            <div class="gallery-card__image">
              <img src="assets/sample-previews/524-line-stickers.png" width="1200" height="800" alt="黄色いキャラクター524のスタンプと絵文字のページ">
            </div>
            <div class="gallery-card__caption">
              <h2>524のスタンプと絵文字</h2>
              <p>キャラクター</p>
            </div>
          </a>
        </article>
      </div>
      <p class="filter-empty" data-empty-state role="status" hidden>該当するサンプルはありません。</p>
    </section>
    <aside class="gallery-note" aria-label="サンプルについて">
      <p>飲食店は架空のサンプルです。524は販売中のLINEスタンプと絵文字を掲載しています。</p>
      <p>飲食デモの「記事の下書き」は、固定文を表示する見本です。</p>
    </aside>
  </main>
  <footer class="gallery-footer gallery-wrap"><small>© 2026 LP SAMPLE BOOK</small></footer>
</body>
</html>
